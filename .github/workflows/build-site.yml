name: Build & deploy package repositories

# Rebuilds the whole site from scratch and deploys it to GitHub Pages
# (https://firn-labs.github.io/packages/):
#
#   keys/                    the Firn Labs packaging key (.asc, .gpg, FINGERPRINT)
#   <project>/arch/x86_64/   pacman repository (signed db + packages)
#   <project>/apt/           APT repository (dists/stable + pool, InRelease signed)
#   <project>/rpm/           dnf/zypper repo (repodata + signed rpms)
#   <project>/index.html     that project's install page
#
# One job group per project (today: unkai).  To add a project, copy
# the `unkai-*` jobs, add a `<project>/` folder with its scripts + site
# page, and download its artifacts in `deploy`.
#
# Stateless by design: every run lists the newest KEEP published,
# non-prerelease releases of each project, downloads their assets,
# builds + signs the repositories, and publishes with
# actions/deploy-pages.  Nothing is committed here, so the repo never
# grows and a broken deploy is fixed by re-running.
#
# Triggers:
#   repository_dispatch  — sent by a project's release workflow when a
#                          release is *published* (the ship moment)
#   workflow_dispatch    — manual re-run / first bootstrap
#   schedule             — daily safety net in case a dispatch was lost
#
# Secret: PACKAGING_GPG_PRIVATE_KEY — ASCII-armoured private key
# WITHOUT a passphrase (see README.md).

on:
  repository_dispatch:
    types: [release-published]
  workflow_dispatch:
  schedule:
    - cron: "23 6 * * *"

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

env:
  KEEP: "3"

jobs:
  check:
    name: Check signing key
    runs-on: ubuntu-latest
    steps:
      - env:
          KEY: ${{ secrets.PACKAGING_GPG_PRIVATE_KEY }}
        run: |
          if [ -z "$KEY" ]; then
            echo "::error::PACKAGING_GPG_PRIVATE_KEY is not set — see README.md"
            exit 1
          fi

  # ── Unkai Mail ─────────────────────────────────────────────────
  unkai-versions:
    name: unkai · resolve releases
    needs: check
    runs-on: ubuntu-latest
    env:
      SOURCE_REPO: firn-labs/unkai-mail
    outputs:
      tags: ${{ steps.list.outputs.tags }}
      latest: ${{ steps.list.outputs.latest }}
    steps:
      - id: list
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tags=$(gh release list --repo "$SOURCE_REPO" \
                   --exclude-drafts --exclude-pre-releases \
                   --limit "$KEEP" --json tagName --jq '[.[].tagName]')
          echo "tags=$tags" >> "$GITHUB_OUTPUT"
          echo "latest=$(echo "$tags" | jq -r '.[0]')" >> "$GITHUB_OUTPUT"
          echo "unkai: $tags"

  unkai-arch:
    name: unkai · pacman repository
    needs: unkai-versions
    runs-on: ubuntu-latest
    container: archlinux:base-devel
    steps:
      - uses: actions/checkout@v7
      - name: Prepare
        run: |
          pacman -Syu --noconfirm --needed sudo git curl
          useradd -m builder
          echo "builder ALL=(ALL) NOPASSWD: ALL" > /etc/sudoers.d/builder
          chown -R builder .
      # makepkg refuses to run as root; -H so the key lands in the
      # builder's own keyring.
      - name: Build + sign
        env:
          TAGS: ${{ needs.unkai-versions.outputs.tags }}
          PACKAGING_GPG_PRIVATE_KEY: ${{ secrets.PACKAGING_GPG_PRIVATE_KEY }}
        run: sudo -E -H -u builder bash unkai/scripts/build-arch.sh out/unkai/arch
      - uses: actions/upload-artifact@v6
        with:
          name: unkai-arch
          path: out/unkai/arch
          if-no-files-found: error

  unkai-apt:
    name: unkai · APT repository
    needs: unkai-versions
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - run: sudo apt-get update && sudo apt-get install -y apt-utils gnupg
      - name: Build + sign
        env:
          TAGS: ${{ needs.unkai-versions.outputs.tags }}
          PACKAGING_GPG_PRIVATE_KEY: ${{ secrets.PACKAGING_GPG_PRIVATE_KEY }}
        run: bash unkai/scripts/build-apt.sh out/unkai/apt
      - uses: actions/upload-artifact@v6
        with:
          name: unkai-apt
          path: out/unkai/apt
          if-no-files-found: error

  unkai-rpm:
    name: unkai · dnf repository
    needs: unkai-versions
    runs-on: ubuntu-latest
    container: fedora:latest
    steps:
      - uses: actions/checkout@v7
      - run: dnf install -y createrepo_c rpm-sign gnupg2 curl
      - name: Build + sign
        env:
          TAGS: ${{ needs.unkai-versions.outputs.tags }}
          PACKAGING_GPG_PRIVATE_KEY: ${{ secrets.PACKAGING_GPG_PRIVATE_KEY }}
        run: bash unkai/scripts/build-rpm.sh out/unkai/rpm
      - uses: actions/upload-artifact@v6
        with:
          name: unkai-rpm
          path: out/unkai/rpm
          if-no-files-found: error

  # ── Site ───────────────────────────────────────────────────────
  deploy:
    name: Deploy to GitHub Pages
    needs: [unkai-versions, unkai-arch, unkai-apt, unkai-rpm]
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v7
        with:
          name: unkai-arch
          path: _site/unkai/arch
      - uses: actions/download-artifact@v7
        with:
          name: unkai-apt
          path: _site/unkai/apt
      - uses: actions/download-artifact@v7
        with:
          name: unkai-rpm
          path: _site/unkai/rpm
      - name: Assemble site
        env:
          LATEST_UNKAI: ${{ needs.unkai-versions.outputs.latest }}
          PACKAGING_GPG_PRIVATE_KEY: ${{ secrets.PACKAGING_GPG_PRIVATE_KEY }}
        run: bash scripts/assemble.sh _site
      - uses: actions/upload-pages-artifact@v4
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
